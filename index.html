<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 2 ELA Teacher Manual Master Hub</title>
  <style>
    /* Apple Inspired Dark Theme */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #f5f5f7;
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* The Frosted Glass Sidebar */
    #sidebar {
      width: 280px;
      background: rgba(40, 40, 40, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      padding: 40px 20px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    #sidebar h1 {
      font-size: 1.3em;
      margin-top: 0;
      margin-bottom: 40px;
      color: #fff;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.5px;
    }

    .nav-item {
      padding: 14px 18px;
      margin-bottom: 10px;
      border-radius: 10px;
      cursor: pointer;
      color: #ebebf5;
      font-weight: 500;
      font-size: 1.1em;
      transition: background 0.2s, color 0.2s;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
    }

    /* Main Content Area */
    #content-area {
      flex: 1;
      padding: 60px 80px;
      overflow-y: auto;
      background-color: #1c1c1e;
    }

    .subject-title {
      font-size: 2.8em;
      margin-top: 0;
      margin-bottom: 25px;
      color: #fff;
      font-weight: 700;
    }

    .action-bar {
      margin-bottom: 50px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      background: #0a84ff; /* Sleek accent blue */
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 24px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #007aff;
      transform: scale(1.02);
    }

    /* Media Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 40px;
    }

    .media-card {
      background: #2c2c2e;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .media-title {
      font-size: 1.4em;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    .media-description {
      color: #aeaeb2;
      font-size: 0.95em;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    audio, video {
      width: 100%;
      border-radius: 12px;
      outline: none;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Sidebar Menu -->
  <nav id="sidebar">
    <h1>Grade 2 ELA<br>Teacher Manual<br>Master Hub</h1>
    <div id="nav-links"></div>
  </nav>

  <!-- Content Viewing Area -->
  <main id="content-area">
    <!-- The javascript will inject the clicked subject's media right here -->
  </main>

  <script>
    let hubData = {};

    // Pull the exact same data.json you already built
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        hubData = data.subjects;
        buildNavigation();
        
        // Auto-load the first subject (Reading) when the page opens
        renderSubject(Object.keys(hubData)[0]);
      })
      .catch(error => console.error('Error loading the ELA data:', error));

    function buildNavigation() {
      const navContainer = document.getElementById('nav-links');
      navContainer.innerHTML = '';
      
      for (const key in hubData) {
        const navItem = document.createElement('div');
        navItem.className = 'nav-item';
        navItem.innerText = hubData[key].title;
        navItem.onclick = () => renderSubject(key);
        navItem.id = 'nav-' + key;
        navContainer.appendChild(navItem);
      }
    }

    function renderSubject(subjectKey) {
      // Highlight the active subject in the sidebar
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('nav-' + subjectKey).classList.add('active');

      const sub = hubData[subjectKey];
      const contentArea = document.getElementById('content-area');
      
      let objectivesHtml = '';
      for (const q in sub.objectives) {
        objectivesHtml += `<a href="${sub.objectives[q]}" target="_blank" class="btn">${q} Objectives</a> `;
      }

      // Build the focused layout for the selected subject
      contentArea.innerHTML = `
        <h2 class="subject-title">${sub.title}</h2>
        <div class="action-bar">
          <a href="${sub.manual_pdf}" target="_blank" class="btn">📖 Read Master Manual</a>
          ${objectivesHtml}
        </div>

        <div class="media-grid">
          <div class="media-card">
            <div class="media-title">🎧 ${sub.podcast.title}</div>
            <div class="media-description">${sub.podcast.description}</div>
            <audio controls preload="metadata">
              <source src="${sub.podcast.url}" type="audio/mp4">
            </audio>
          </div>

          <div class="media-card">
            <div class="media-title">📺 ${sub.video.title}</div>
            <div class="media-description">${sub.video.description}</div>
            <video controls preload="metadata">
              <source src="${sub.video.url}" type="video/mp4">
            </video>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
