<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 2 ELA Teacher Master Hub</title>
  <style>
    /* Clean, modern background */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      margin: 0;
      padding: 40px 20px;
    }
    
    h1 {
      text-align: center;
      color: #102a43;
      margin-bottom: 40px;
      font-size: 2.5em;
    }

    /* Grid layout for the subject cards */
    #dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card aesthetic with soft shadow */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    .card h2 {
      color: #243b53;
      border-bottom: 3px solid #627d98;
      padding-bottom: 10px;
      margin-top: 0;
    }

    /* Buttons for PDFs */
    .btn {
      display: inline-block;
      background: #3e5c76;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1d2d44;
    }

    /* Media section styling and hover reveals */
    .media-section {
      margin-top: 25px;
      padding: 15px;
      background: #f9f9fa;
      border-radius: 12px;
      border: 1px solid #e4e7eb;
    }

    .media-title {
      font-weight: bold;
      color: #102a43;
      cursor: default;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .media-description {
      font-size: 0.9em;
      color: #486581;
      margin-top: 8px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.4s ease;
    }

    /* This triggers the hidden description to appear when hovering over the section */
    .media-section:hover .media-description {
      max-height: 100px;
      opacity: 1;
      margin-bottom: 10px;
    }

    audio, video {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      outline: none;
    }
  </style>
</head>
<body>

  <h1>Grade 2 ELA Resource Dashboard</h1>
  <div id="dashboard"></div>

  <script>
    // This script connects your data.json file to the website visuals
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        const dashboard = document.getElementById('dashboard');
        const subjects = data.subjects;
        
        for (const key in subjects) {
          const sub = subjects[key];
          const card = document.createElement('div');
          card.className = 'card';
          
          // Generate buttons for all quarters listed in data.json
          let objectivesHtml = '';
          for (const q in sub.objectives) {
            objectivesHtml += `<a href="${sub.objectives[q]}" target="_blank" class="btn">${q} Objectives</a> `;
          }

          card.innerHTML = `
            <h2>${sub.title}</h2>
            <a href="${sub.manual_pdf}" target="_blank" class="btn">📖 Read Master Manual</a>
            
            <div class="media-section">
              <div class="media-title">🎧 ${sub.podcast.title}</div>
              <div class="media-description">${sub.podcast.description}</div>
              <audio controls preload="metadata">
                <source src="${sub.podcast.url}" type="audio/mp4">
                Your browser does not support the audio player.
              </audio>
            </div>

            <div class="media-section">
              <div class="media-title">📺 ${sub.video.title}</div>
              <div class="media-description">${sub.video.description}</div>
              <video controls preload="metadata">
                <source src="${sub.video.url}" type="video/mp4">
                Your browser does not support the video player.
              </video>
            </div>
            
            <div class="media-section" style="background: transparent; border: none; padding: 0;">
              ${objectivesHtml}
            </div>
          `;
          dashboard.appendChild(card);
        }
      })
      .catch(error => console.error('Error loading the ELA data:', error));
  </script>

</body>
</html>
